[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-net-health"
version = "2.0.0"
description = "Terminal monitor for Codex process, network, and conversation health"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["codex", "network", "monitoring", "terminal", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
codexnet = "codex_net_health.cli:run"
codex-net-health = "codex_net_health.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["codex_net_health"]
mypy_path = "src"
