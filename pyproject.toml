[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codexdeck"
dynamic = ["version"]
description = "Read-only operations console for Codex sessions, tools, terminals, and network health"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["codex", "network", "monitoring", "terminal", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]
dependencies = [
    "rich==15.0.0",
    "textual==8.2.8",
    "tomli==2.4.1; python_version < '3.11'",
]

[project.scripts]
codexdeck = "cli:run"

[tool.setuptools]
py-modules = [
  "app",
  "cli",
  "config",
  "diagnostics",
  "engine",
  "engine_collectors",
  "engine_refresh",
  "models",
  "preferences",
  "snapshot_publisher",
  "sound_setup",
  "state_machine",
  "state_axes",
  "state_summaries",
  "temporal",
  "utils",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["codex*", "network*", "presentation*"]

[tool.setuptools.package-data]
"presentation.tui" = ["*.tcss"]

[tool.setuptools.dynamic]
version = {attr = "config.VERSION"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = [
  "src/models.py",
  "src/codex/events.py",
  "src/codex/terminal.py",
  "src/codex/paths.py",
  "src/codex/processes.py",
  "src/network/classifier.py",
  "src/sound_setup.py",
  "src/state_machine.py",
  "src/state_axes.py",
  "src/state_summaries.py",
]
mypy_path = "src"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tomllib", "tomli"]
ignore_missing_imports = true
