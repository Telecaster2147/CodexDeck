[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codexdeck"
dynamic = ["version"]
description = "Read-only operations console for Codex sessions, tools, terminals, and network health"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["codex", "network", "monitoring", "terminal", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]
dependencies = [
    "textual>=8.2.8,<9",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
codexdeck = "cli:run"

[tool.setuptools]
py-modules = [
  "app",
  "cli",
  "config",
  "diagnostics",
  "engine",
  "history",
  "models",
  "preferences",
  "snapshot_publisher",
  "state_machine",
  "utils",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["codex*", "network*", "presentation*"]

[tool.setuptools.package-data]
"presentation.tui" = ["*.tcss"]

[tool.setuptools.dynamic]
version = {attr = "config.VERSION"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
