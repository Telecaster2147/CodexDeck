[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-net-health"
dynamic = ["version"]
description = "Terminal monitor for Codex process, network, and conversation health"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["codex", "network", "monitoring", "terminal", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
codexnet = "cli:run"
codex-net-health = "cli:run"

[tool.setuptools]
py-modules = [
  "app",
  "cli",
  "config",
  "diagnostics",
  "engine",
  "history",
  "models",
  "state_machine",
  "utils",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["codex*", "network*", "presentation*"]

[tool.setuptools.dynamic]
version = {attr = "config.VERSION"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
