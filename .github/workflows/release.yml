name: Release checks

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - name: Verify main CI for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '
                [.check_runs[]
                  | select(.name == "lint-types" or .name == "test")
                  | .conclusion] as $required
                | ($required | length) == 2
                  and all($required[]; . == "success")
              '
          )
          test "${verified}" = true
      - name: Verify release version
        run: |
          version=$(uv run python -c 'from config import VERSION; print(VERSION)')
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Build and checksum
        run: |
          uv build
          cd dist
          sha256sum codexdeck-*-py3-none-any.whl > codexdeck-${GITHUB_REF_NAME#v}-py3-none-any.whl.sha256
          sha256sum -c codexdeck-${GITHUB_REF_NAME#v}-py3-none-any.whl.sha256
      - name: Install smoke
        run: |
          uv venv --clear .release-smoke
          uv pip install --python .release-smoke/bin/python dist/codexdeck-*-py3-none-any.whl
          .release-smoke/bin/codexdeck --version
      - name: Retain verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: codexdeck-${{ github.ref_name }}
          path: |
            dist/codexdeck-*.whl
            dist/codexdeck-*.whl.sha256
            dist/codexdeck-*.tar.gz
          if-no-files-found: error
