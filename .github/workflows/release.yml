name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexdeck-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Telecaster2147/CodexDeck' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Verify CI on manual retry
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --event push --commit "$GITHUB_SHA" --status completed --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          test -n "$run_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs | [ .[] | select(.name == "lint-types" or .name == "test" or .name == "latest-smoke" or .name == "performance-pty" or .name == "supply-chain" or .name == "build") ] | length == 6 and all(.[]; .conclusion == "success")' \
            | grep -Fx true
      - name: Build, verify and publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh
