name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  lint-types:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked
      - run: uvx ruff check src tests tools
      - run: uvx mypy

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --with coverage coverage run -m unittest discover -s tests -v
      - run: uv run --with coverage coverage report

  latest-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: >
          uv run python -m unittest
          tests.test_app
          tests.test_adapters
          tests.test_governance
          tests.test_replay
          tests.test_temporal
          tests.test_terminal

  performance-pty:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python tools/check_performance.py --output performance-report.json
      - run: uv run python tools/verify_pty.py --output pty-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-pty-${{ github.sha }}
          path: |
            performance-report.json
            pty-report.json

  supply-chain:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv lock --check
      - run: mkdir -p build && uv export --frozen --no-dev --no-emit-project -o build/requirements.txt
      - run: uvx pip-audit -r build/requirements.txt
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  nightly-matrix:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Telecaster2147/CodexDeck'
    needs: [lint-types, test, latest-smoke, performance-pty, supply-chain, build]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
